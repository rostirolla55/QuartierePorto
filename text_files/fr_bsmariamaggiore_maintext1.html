<p style="line-height: 116%; margin-bottom: 0.28cm">
La <b>Basilique Santa Maria Maggiore</b>, située au <b>10 Via
Galliera</b>, est considérée comme la plus ancienne église de
Bologne dédiée à la Vierge Marie. C'est un lieu au charme
saisissant qui associe des origines paléochrétiennes à une
imposante architecture baroque.</p>
