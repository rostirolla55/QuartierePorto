<p style="line-height: 116%; margin-bottom: 0.28cm">
La <b>Basílica de Santa Maria Maggiore</b>, situada en <b>Via
Galliera 10</b>, está considerada la iglesia más antigua de Bolonia
dedicada a la Virgen María. Es un lugar de gran fascinación que
combina orígenes paleocristianos con una imponente arquitectura
barroca.</p>
