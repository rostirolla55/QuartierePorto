<p style="line-height: 116%; margin-bottom: 0.28cm">
La <b>Basilica di Santa Maria Maggiore</b>, situata in <b>via
Galliera 10</b>, è considerata la più antica chiesa di Bologna
dedicata alla Madonna. È un luogo di grande fascino che mescola
origini paleocristiane con un'imponente veste barocca.</p>
